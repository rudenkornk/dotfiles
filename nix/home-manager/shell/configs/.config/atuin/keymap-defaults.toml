# This baseline follows Atuin 18.21.0 and omits tmux's C-hjkl/C-s and the Enter-equivalent C-m.
[emacs]
ctrl-a = "enter-prefix-mode"
ctrl-c = "return-original"
ctrl-g = "return-original"
ctrl-o = "toggle-tab"
ctrl-b = "cursor-left"
ctrl-f = "cursor-right"
ctrl-e = "cursor-end"
ctrl-w = "delete-to-word-boundary"
ctrl-u = "clear-line"
ctrl-r = "cycle-filter-mode"
ctrl-n = "select-next"
ctrl-p = "select-previous"
alt-b = "cursor-word-left"
alt-f = "cursor-word-right"
alt-d = "delete-word-after"
ctrl-d = [{ when = "input-empty", action = "return-original" }, { action = "delete-char-after" }]

[vim-normal]
ctrl-a = "enter-prefix-mode"
ctrl-c = "return-original"
ctrl-g = "return-original"
ctrl-o = "toggle-tab"
h = "cursor-left"
l = "cursor-right"
w = "cursor-word-right"
b = "cursor-word-left"
e = "cursor-word-end"
x = "delete-char-after"
"d d" = "clear-line"
D = "clear-to-end"
C = "vim-change-to-end"
a = "vim-enter-insert-after"
A = "vim-enter-insert-at-end"
i = "vim-enter-insert"
I = "vim-enter-insert-at-start"
ctrl-u = "scroll-half-page-up"
ctrl-d = "scroll-half-page-down"
ctrl-b = "scroll-page-up"
ctrl-f = "scroll-page-down"
G = "scroll-to-bottom"
"g g" = "scroll-to-top"
H = "scroll-to-screen-top"
M = "scroll-to-screen-middle"
L = "scroll-to-screen-bottom"

[inspector]
ctrl-a = "enter-prefix-mode"
ctrl-c = "return-original"
ctrl-g = "return-original"
ctrl-o = "toggle-tab"
ctrl-d = "delete"

[prefix]
d = "delete"
D = "delete-all"
a = "cursor-start"
c = [{ when = "has-context", action = "clear-context" }, { action = "switch-context" }]

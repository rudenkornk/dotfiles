font_family             JetBrainsMono Nerd Font
font_size               14.0

scrollback_lines        100000

cursor_blink_interval   0
cursor_shape            beam

enable_audio_bell       no
confirm_os_window_close 0

# https://github.com/kovidgoyal/kitty/issues/1951
clipboard_control       write-clipboard write-primary no-append
hide_window_decorations yes

shell                   fish
shell_integration       no-cursor

# Ctrl+Enter and Shift+Enter: emit explicit CSI-u sequences so inner apps can tell them apart from plain Enter.
# kitty only reports these distinctly under its own keyboard protocol, which tmux does not
# speak to the outer terminal — tmux requests the legacy modifyOtherKeys protocol, which kitty does not
# implement, so otherwise the modifier is lost at the kitty -> tmux hop and both read as Enter (submit).
# Paired with `extended-keys always` in tmux, which forwards the sequence instead of collapsing it to CR.
map ctrl+enter  send_text all \x1b[13;5u
map shift+enter send_text all \x1b[13;2u

include                 themes/Dracula.conf
background              #1a1b26

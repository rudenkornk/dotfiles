[extend]
# useDefault will extend the default gitleaks config built in to the binary
# the latest version is located at:
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
useDefault = true

[[allowlists]]
paths = [".gitsecret/paths/mapping.cfg"]
commits = [
  "da6ae24cdd06d40b7fa3c6ba419be87d46357f40",
  "67c1d72132b574a344b54544695ee23f780e36f3",
  "a79fe4940f70d9c292c9d4d9ffadd54bc9217b91",
  "b682fda8234c4d8bd1d38ccfb1d7e5070f0827be",
  "daab2439202d1d59ed1cb369b25bdd572b10ebdd",
  "3592e05758bb336129fd72a6d956443ecfd75e82",
]

# APT repos keys
stopwords = [
  "0x59FDA1CE1B84B3FAD89366C027557F056DC33CA5",
  "0x60C317803A41BA51845E371A1E9377A2BA9EF27F",
]

# Note: gitleaks assumes that actual secret part of a regex match is N-th capture group,
# which by default is `secretGroup = 1`.
# If regex does not have capture groups then entire match considered a secret.

[[rules]]
id = "yandex-internal"
description = "Yandex internal URL"
regex = '''(?i)yandex.net|yandex-team.ru|yteam.(.*)'''

[[rules]]
id = "facter-serial-number"
description = "Hardware serial number in a nixos-facter report"
path = '''facter[^/]*\.json'''
regex = '''"(?i)serial"\s*:\s*(.+)'''

[[rules]]
id = "facter-by-id-device-name"
description = "Stable device name embedding a serial number in a nixos-facter report"
path = '''facter[^/]*\.json'''
regex = '''(?i)/by-(?:id|uuid|partuuid|partlabel|label)/(.+)'''

[[rules]]
id = "facter-mac-address"
description = "MAC address in a nixos-facter report"
path = '''facter[^/]*\.json'''
regex = '''(?i)\b(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b'''

[[rules]]
id = "facter-uuid"
description = "UUID in a nixos-facter report"
path = '''facter[^/]*\.json'''
regex = '''(?i)\b[0-9A-Fa-f]{8}-(?:[0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}\b'''
